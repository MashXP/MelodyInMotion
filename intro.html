<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melody in Motion - Introduction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredoka:wght@300;400;500;600;700&family=Itim&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=25">
  <style>
    body {
      background-color: #fafaf9 !important;
      background-image: 
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='150'><line x1='0' y1='40' x2='100' y2='40' stroke='%23e2e8f0' stroke-width='1.5' stroke-dasharray='3 4'/><line x1='0' y1='48' x2='100' y2='48' stroke='%23e2e8f0' stroke-width='1.5' stroke-dasharray='3 4'/><line x1='0' y1='56' x2='100' y2='56' stroke='%23e2e8f0' stroke-width='1.5' stroke-dasharray='3 4'/><line x1='0' y1='64' x2='100' y2='64' stroke='%23e2e8f0' stroke-width='1.5' stroke-dasharray='3 4'/><line x1='0' y1='72' x2='100' y2='72' stroke='%23e2e8f0' stroke-width='1.5' stroke-dasharray='3 4'/></svg>") !important;
      background-repeat: repeat !important;
      background-position: left top !important;
      color: #1e293b !important;
    }

    /* Intro Specific Layout Styles */
    @keyframes slideUp {
      from {
        transform: translateY(180px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .intro-bottom-row {
      display: flex;
      gap: 2rem;
      align-items: flex-end;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto 2rem auto;
      box-sizing: border-box;
      padding: 0 1rem;
      z-index: 10;
      position: relative;
      animation: slideUp 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .intro-visuals {
      display: flex;
      align-items: flex-end;
      gap: 1.5rem;
      flex-shrink: 0;
    }

    .character-profile {
      width: 150px;
      height: 150px;
      border: 4px solid #000000;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 6px 6px 0px #000000;
      background-color: #ffffff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dialogue-box {
      flex: 1;
      border: 4px solid #000000;
      border-radius: 24px;
      box-shadow: 8px 8px 0px #000000;
      background-color: #ffffff;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 240px;
      box-sizing: border-box;
    }

    .dialogue-header {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
      border-bottom: 3.5px dashed #000000;
      padding-bottom: 0.4rem;
      margin-bottom: 0.75rem;
      font-family: 'Itim', sans-serif;
    }

    .dialogue-body {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .dialogue-body p {
      margin: 0;
      font-size: 1.3rem;
      line-height: 1.6;
      color: #1e293b;
      font-family: 'Itim', sans-serif;
    }

    .dialogue-footer {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 0.75rem;
    }

    .middle-empty-card {
      flex: 2.5;
      margin: 1rem auto;
      width: 100%;
      max-width: 1400px;
      background-color: #ffffff;
      border: 4px solid #000000;
      border-radius: 24px;
      box-shadow: 8px 8px 0px #000000;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 460px;
      height: 500px;
      opacity: 0.95;
      position: relative;
      overflow: hidden;
    }

    @media (max-width: 1024px) {
      .intro-bottom-row {
        flex-direction: column;
        align-items: stretch;
        gap: 1.5rem;
      }
      .intro-visuals {
        justify-content: center;
      }
      .dialogue-box {
        height: 280px;
      }
      .middle-empty-card {
        height: auto;
        min-height: 400px;
      }
    }

    @keyframes floatNote {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <!-- Floating Animated Music Notes Background -->
  <div class="floating-notes-container">
    <div class="floating-note note-1">𝄞</div>
    <div class="floating-note note-2">♪</div>
    <div class="floating-note note-3">♫</div>
    <div class="floating-note note-4">♩</div>
    <div class="floating-note note-5">♬</div>
    <div class="floating-note note-6">♩</div>
    <div class="floating-note note-7">♪</div>
    <div class="floating-note note-8">♫</div>
    <div class="floating-note note-9">𝄞</div>
    <div class="floating-note note-10">♬</div>
    <div class="floating-note note-11">♪</div>
    <div class="floating-note note-12">♩</div>
    <div class="floating-note note-13">♫</div>
    <div class="floating-note note-14">♬</div>
    <div class="floating-note note-15">𝄞</div>
    <div class="floating-note note-16">♪</div>
  </div>

  <div class="app-container">
    <!-- Smol Header -->
    <header class="smol-header">
      <div class="logo-area" style="display: flex; align-items: center; gap: 0.5rem;">
        <img src="public/logo.PNG" alt="Melody in Motion Logo" class="header-logo-img">
        <h1 style="font-size: 1.5rem; font-weight: 800; font-family: 'Itim', sans-serif; color: #1e293b; margin: 0;">Smol</h1>
      </div>
      <div>
        <select id="lang-selector-header" class="synth-select" style="padding: 0.4rem 0.8rem; font-size: 1.1rem; border-radius: 8px; border: 3px solid #1e293b; background: #ffffff; color: #1e293b; font-family: 'Itim', sans-serif;">
          <option value="en">🇺🇸 English</option>
          <option value="vi">🇻🇳 Tiếng Việt</option>
          <option value="ko">🇰🇷 한국어</option>
        </select>
      </div>
    </header>

    <!-- Main Content Grid with dialogue area -->
    <main id="music-app-content" style="display: flex; flex-direction: column; height: 100%; justify-content: space-between;">
      <!-- Middle section: Empty Card Placeholder -->
      <div class="middle-empty-card" id="middle-guide-content"></div>

      <!-- Bottom dialogue bar with character profile & dialogue box -->
      <div class="intro-bottom-row">
        <!-- Left: Profile -->
        <div class="intro-visuals">
          <div class="character-profile">
            <img id="melody-img" src="public/maincharacter/8-lineboiler.gif" alt="Melody">
          </div>
        </div>

        <!-- Right: Dialogue Box -->
        <div class="dialogue-box">
          <div class="dialogue-header">Melody</div>
          <div class="dialogue-body">
            <p id="dialogue-text"></p>
          </div>
          <div class="dialogue-footer">
            <button id="btn-back" class="welcome-action-btn" style="padding: 0.6rem 1.2rem !important; margin: 0; font-size: 1.1rem !important; width: auto !important; display: inline-block !important;"></button>
            <button id="btn-next" class="welcome-action-btn btn-next" style="padding: 0.6rem 1.2rem !important; margin: 0; font-size: 1.1rem !important; width: auto !important; display: inline-block !important; background-color: #fef08a !important;"></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const DIALOGUES = {
      en: [
        "Hi There. I’m Melody!",
        "I’ll be with you in this journey to explore musical notes through visual and sign language.",
        "In this game, each musical note has its own color, position, and hand sign to help you recognize and remember it more easily.",
        "Watch the notes as they appear on the sheet and make the matching hand sign.",
        "The more lessons you complete, the more exciting melodies you’ll discover."
      ],
      vi: [
        "Xin chào! Mình là Melody.",
        "Mình sẽ đồng hành cùng bạn trong hành trình tìm hiểu các nốt nhạc thông qua hình ảnh và ngôn ngữ ký hiệu.",
        "Trong trò chơi này, mỗi nốt nhạc sẽ có màu sắc, vị trí và ký hiệu tay riêng để giúp bạn dễ dàng nhận biết và ghi nhớ.",
        "Hãy quan sát các nốt nhạc xuất hiện trên khuông nhạc và thực hiện đúng ký hiệu tay tương ứng!",
        "Càng hoàn thành nhiều bài học, bạn sẽ càng khám phá được nhiều giai điệu thú vị hơn."
      ],
      ko: [
        "안녕하세요! 저는 멜로디예요.",
        "그림과 수어를 통해 음표를 배우는 여정을 함께할게요.",
        "이 게임에서는 각 음표마다 고유한 색상과 위치, 손동작이 있어 쉽고 재미있게 배울 수 있어요.",
        "오선지에 나타나는 음표를 보고 맞는 손동작을 해 보세요!",
        "더 많은 학습을 완료할수록 더 멋진 멜로디를 만나게 될 거예요."
      ]
    };

    let currentStep = 0;
    let currentLang = localStorage.getItem("signquest_lang") || "en";
    let typingInterval = null;
    let isTyping = false;
    let fullActiveText = "";
    let currentAudio = null;

    const VOICE_PATHS = {
      en: [
        "public/voice/english/TA line 3.m4a",
        "public/voice/english/TA Line 4.m4a",
        "public/voice/english/TA line 5.m4a",
        "public/voice/english/TA line 6.m4a",
        "public/voice/english/TA line 7.m4a"
      ],
      vi: [
        "public/voice/vietnamese/TV Line 3 Xin chào mình là melody.m4a",
        "public/voice/vietnamese/TV Line 4 mình sẽ đồng hành cùng bạn.m4a",
        "public/voice/vietnamese/TV line 5 trong trò chơi này mỗi nốt nhạc.m4a",
        "public/voice/vietnamese/TV line 6 hãy quan sát các nốt nhạc.m4a",
        "public/voice/vietnamese/TV line 7 càng hoàn thành nhiều bài học.m4a"
      ],
      ko: [
        "public/voice/korean/TH line 3.m4a",
        "public/voice/korean/TH line 4.m4a",
        "public/voice/korean/TH line 5.m4a",
        "public/voice/korean/TH line 6.m4a",
        "public/voice/korean/TH line 7.m4a"
      ]
    };

    function playDialogueVoice(step, lang) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      const langPaths = VOICE_PATHS[lang] || VOICE_PATHS.en;
      const path = langPaths[step];
      if (!path) return;

      currentAudio = new Audio(path);
      currentAudio.play().catch(err => {
        console.warn("Autoplay was blocked or audio failed to load:", err);
      });
    }

    // Try to play audio on first user gesture if blocked by autoplay
    function handleFirstUserGesture() {
      if (currentAudio && currentAudio.paused) {
        currentAudio.play().catch(err => console.log("Audio play blocked on gesture:", err));
      }
      document.removeEventListener("click", handleFirstUserGesture);
      document.removeEventListener("keydown", handleFirstUserGesture);
    }
    document.addEventListener("click", handleFirstUserGesture);
    document.addEventListener("keydown", handleFirstUserGesture);

    const langSelector = document.getElementById("lang-selector-header");
    const melodyImgEl = document.getElementById("melody-img");
    const dialogueTextEl = document.getElementById("dialogue-text");
    const btnBack = document.getElementById("btn-back");
    const btnNext = document.getElementById("btn-next");

    function typeWordByWord(text, element) {
      if (typingInterval) clearInterval(typingInterval);
      isTyping = true;
      fullActiveText = text;
      element.innerHTML = "";
      const words = text.split(" ");
      let index = 0;

      typingInterval = setInterval(() => {
        if (index < words.length) {
          element.innerHTML += (index === 0 ? "" : " ") + words[index];
          index++;
        } else {
          clearInterval(typingInterval);
          typingInterval = null;
          isTyping = false;
        }
      }, 120);
    }

    function updateGuideVisuals(step) {
      const guideEl = document.getElementById("middle-guide-content");
      if (!guideEl) return;

      // 1. Initial render of mock gameplay UI if not already present
      if (!guideEl.querySelector(".mock-gameplay-ui")) {
        guideEl.innerHTML = `
          <div class="mock-gameplay-ui" style="display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box; padding: 1.25rem; gap: 1rem; background: #f8fafc; position: relative;">
            
            <!-- Sheet Music Panel -->
            <div id="mock-music-panel" style="border: 3.5px solid #000; border-radius: 16px; background: #fff; padding: 0.75rem; box-shadow: 4px 4px 0 #000; position: relative; height: 150px; display: flex; flex-direction: column; justify-content: center; z-index: 1;">
              <div style="position: absolute; top: 8px; left: 12px; font-family: 'Itim', sans-serif; font-size: 1.15rem; font-weight: bold; color: #475569;">SHEET MUSIC TRACKER</div>
              
              <!-- 5 staff lines -->
              <div style="display: flex; flex-direction: column; gap: 12px; width: 100%; padding: 0 10px; margin-top: 15px;">
                <div style="border-bottom: 2.5px solid #cbd5e1; width: 100%;"></div>
                <div style="border-bottom: 2.5px solid #cbd5e1; width: 100%;"></div>
                <div style="border-bottom: 2.5px solid #cbd5e1; width: 100%;"></div>
                <div style="border-bottom: 2.5px solid #cbd5e1; width: 100%;"></div>
                <div style="border-bottom: 2.5px solid #cbd5e1; width: 100%;"></div>
              </div>
              
              <!-- Target pointer -->
              <div style="position: absolute; left: 15%; top: 0; bottom: 0; width: 6px; background: #eab308; border-radius: 3px; box-shadow: 0 0 8px rgba(234,179,8,0.5);"></div>
              
              <!-- Floating notes on staff -->
              <div class="mock-note" id="note-1" style="position: absolute; left: 15%; top: 78px; width: 48px; height: 48px; border-radius: 8px; background: #ef4444; border: 3px solid #000; box-shadow: 3px 3px 0 #000; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-family: 'Itim', sans-serif;">Do</div>
              <div class="mock-note" id="note-2" style="position: absolute; left: 38%; top: 66px; width: 48px; height: 48px; border-radius: 8px; background: #f97316; border: 3px solid #000; box-shadow: 3px 3px 0 #000; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-family: 'Itim', sans-serif;">Re</div>
              <div class="mock-note" id="note-3" style="position: absolute; left: 60%; top: 54px; width: 48px; height: 48px; border-radius: 8px; background: #eab308; border: 3px solid #000; box-shadow: 3px 3px 0 #000; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-family: 'Itim', sans-serif;">Mi</div>
              <div class="mock-note" id="note-4" style="position: absolute; left: 82%; top: 42px; width: 48px; height: 48px; border-radius: 8px; background: #22c55e; border: 3px solid #000; box-shadow: 3px 3px 0 #000; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-family: 'Itim', sans-serif;">Fa</div>
            </div>

            <!-- Bottom Panel (Webcam & Pose Guide Card) -->
            <div id="mock-bottom-panel" style="display: flex; gap: 1rem; flex: 1; min-height: 0;">
              
              <!-- Left: Webcam Camera Container -->
              <div id="mock-camera-panel" style="flex: 1.2; border: 3.5px solid #000; border-radius: 16px; background: #1e293b; box-shadow: 4px 4px 0 #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 1;">
                <div style="position: absolute; top: 8px; left: 12px; font-family: 'Itim', sans-serif; font-size: 1.15rem; font-weight: bold; color: #94a3b8; z-index: 2;">LIVE WEBCAM</div>
                <div style="position: absolute; top: 8px; right: 12px; display: flex; align-items: center; gap: 6px; z-index: 2;">
                  <span style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: blink 1s infinite;"></span>
                  <span style="font-size: 0.85rem; color: #ef4444; font-weight: bold; font-family: 'Itim', sans-serif;">REC</span>
                </div>
                
                <div class="camera-content-overlay" id="camera-overlay-feed" style="display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; z-index: 1;">
                  <div id="camera-hand-icon" style="font-size: 4.5rem; filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));">✊</div>
                  <div style="font-family: 'Itim', sans-serif; font-size: 1.1rem; color: #94a3b8; margin-top: 0.5rem;" id="camera-feed-text">Webcam active - show pose</div>
                </div>
                
                <div id="match-badge" style="position: absolute; bottom: 12px; background: #22c55e; border: 2.5px solid #000; border-radius: 8px; padding: 0.3rem 0.8rem; color: #fff; font-family: 'Itim', sans-serif; font-weight: bold; font-size: 1.1rem; display: none; box-shadow: 2px 2px 0 #000; z-index: 2;">
                  ✨ EXCELLENT MATCH! +100
                </div>
              </div>

              <!-- Right: Guide Guide HUD -->
              <div id="mock-guide-panel" style="flex: 1; border: 3.5px solid #000; border-radius: 16px; background: #fff; box-shadow: 4px 4px 0 #000; padding: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; z-index: 1;">
                <div style="position: absolute; top: 8px; left: 12px; font-family: 'Itim', sans-serif; font-size: 1.15rem; font-weight: bold; color: #475569;">HAND SIGN GUIDE</div>
                
                <div class="guide-card-content" style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
                  <img id="hud-guide-img" src="public/handsign/Do.png" style="height: 110px; object-fit: contain; border: 2.5px dashed #cbd5e1; padding: 4px; border-radius: 12px;">
                  <div id="hud-guide-title" style="font-family: 'Itim', sans-serif; font-size: 1.4rem; font-weight: 800; color: #dc2626;">Show DO (C)</div>
                  <div id="hud-guide-desc" style="font-family: 'Itim', sans-serif; font-size: 0.95rem; color: #64748b;">Make a closed fist (ASL 'S')</div>
                </div>
              </div>

            </div>

            <!-- Welcome / Final Modal Overlay (Full Overlay Card) -->
            <div id="gameplay-modal-overlay" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.75); display: flex; align-items: center; justify-content: center; z-index: 5; border-radius: 16px; backdrop-filter: blur(4px);">
              <!-- Modal Card content is populated dynamically -->
              <div id="modal-card-body" style="background: #fff; border: 4px solid #000; border-radius: 24px; box-shadow: 8px 8px 0 #000; padding: 1.75rem; max-width: 480px; width: 90%; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
              </div>
            </div>

            <!-- Focus Highlighter Frame -->
            <div id="mock-highlighter" style="position: absolute; pointer-events: none; border: 4.5px solid #ef4444; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(15,23,42,0.65); display: none; z-index: 3; transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);">
              <div id="highlighter-tip" style="position: absolute; background: #ef4444; color: #fff; padding: 0.4rem 0.9rem; border-radius: 8px; font-family: 'Itim', sans-serif; font-weight: bold; font-size: 1.05rem; border: 2.5px solid #000; box-shadow: 3px 3px 0 #000; white-space: nowrap; top: -45px; left: 50%; transform: translateX(-50%); z-index: 4;">
                Tip Text
              </div>
            </div>

          </div>
        `;
      }

      // 2. Query references
      const modalOverlay = document.getElementById("gameplay-modal-overlay");
      const modalBody = document.getElementById("modal-card-body");
      const highlighter = document.getElementById("mock-highlighter");
      const highlighterTip = document.getElementById("highlighter-tip");
      const matchBadge = document.getElementById("match-badge");
      
      const musicPanel = document.getElementById("mock-music-panel");
      const cameraPanel = document.getElementById("mock-camera-panel");
      const guidePanel = document.getElementById("mock-guide-panel");

      const hudImg = document.getElementById("hud-guide-img");
      const hudTitle = document.getElementById("hud-guide-title");
      const hudDesc = document.getElementById("hud-guide-desc");

      const cameraHandIcon = document.getElementById("camera-hand-icon");
      const cameraFeedText = document.getElementById("camera-feed-text");

      // Reset styles and classes
      if (modalOverlay) modalOverlay.style.display = "none";
      if (highlighter) highlighter.style.display = "none";
      if (matchBadge) matchBadge.style.display = "none";

      if (cameraHandIcon) cameraHandIcon.innerText = "✊";
      if (cameraFeedText) {
        cameraFeedText.innerText = "Webcam active - show pose";
        cameraFeedText.style.color = "#94a3b8";
      }

      // 3. Update view based on step
      switch(step) {
        case 0:
          // Step 0: Welcome Slide Overlay
          if (modalOverlay && modalBody) {
            modalOverlay.style.display = "flex";
            
            let welcomeTitle = "SignQuest: Melody in Motion";
            let welcomeSubtitle = "Interactive Gameplay Introduction";
            if (currentLang === "vi") {
              welcomeTitle = "SignQuest: Giai điệu chuyển động";
              welcomeSubtitle = "Hướng dẫn tương tác lối chơi";
            } else if (currentLang === "ko") {
              welcomeTitle = "SignQuest: 움직이는 멜로디";
              welcomeSubtitle = "인터랙티브 게임플레이 튜토리얼";
            }

            modalBody.innerHTML = `
              <img src="public/play piano GIF by Internet Cat Video Festival.gif" alt="Cat playing piano" style="height: 200px; border-radius: 12px; border: 3px solid #000; box-shadow: 4px 4px 0px #000; object-fit: cover; max-width: 100%; margin-bottom: 1.25rem;">
              <h3 style="font-family: 'Itim', sans-serif; font-size: 2.1rem; font-weight: 800; color: #1e293b; margin: 0 0 0.5rem 0; line-height: 1.2;">${welcomeTitle}</h3>
              <p style="font-family: 'Itim', sans-serif; font-size: 1.2rem; color: #475569; margin: 0;">${welcomeSubtitle}</p>
            `;
          }
          break;

        case 1:
          // Step 1: General Intro (No highlight)
          if (highlighter) {
            highlighter.style.display = "none";
          }
          break;

        case 2:
          // Step 2: Sheet Music Tracker Focus (line 3 / Dialogue 3)
          if (highlighter && musicPanel) {
            highlighter.style.display = "block";
            
            highlighter.style.left = (musicPanel.offsetLeft - 6) + "px";
            highlighter.style.top = (musicPanel.offsetTop - 6) + "px";
            highlighter.style.width = (musicPanel.offsetWidth + 12) + "px";
            highlighter.style.height = (musicPanel.offsetHeight + 12) + "px";

            let tipText = "🎼 Sheet Music Track";
            if (currentLang === "vi") tipText = "🎼 Bản nhạc dạng cuộn";
            if (currentLang === "ko") tipText = "🎼 스크롤 악보 트랙";

            highlighterTip.innerText = tipText;
            highlighterTip.style.top = "-45px";

            // Set guide to show Do
            hudImg.src = "public/handsign/Do.png";
            hudTitle.innerText = "Show DO (C)";
            hudTitle.style.color = "#dc2626";
            hudDesc.innerText = "Make a closed fist (ASL 'S')";
          }
          break;

        case 3:
          // Step 3: Webcam Camera & Guide HUD Focus (showing match success!)
          const bottomPanel = document.getElementById("mock-bottom-panel");
          if (highlighter && bottomPanel) {
            highlighter.style.display = "block";
            
            highlighter.style.left = (bottomPanel.offsetLeft - 6) + "px";
            highlighter.style.top = (bottomPanel.offsetTop - 6) + "px";
            highlighter.style.width = (bottomPanel.offsetWidth + 12) + "px";
            highlighter.style.height = (bottomPanel.offsetHeight + 12) + "px";

            let tipText = "📷 Interactive Gameplay Loop";
            if (currentLang === "vi") tipText = "📷 Tương tác nhận diện cử chỉ";
            if (currentLang === "ko") tipText = "📷 인터랙티브 게임플레이 루프";

            highlighterTip.innerText = tipText;
            highlighterTip.style.top = "-45px";

            // Make camera show excellent match!
            if (matchBadge) matchBadge.style.display = "block";
            if (cameraHandIcon) cameraHandIcon.innerText = "✊";
            if (cameraFeedText) {
              if (currentLang === "vi") cameraFeedText.innerText = "Ký hiệu khớp chính xác!";
              else if (currentLang === "ko") cameraFeedText.innerText = "완벽하게 일치합니다!";
              else cameraFeedText.innerText = "Gesture matches perfectly!";
              cameraFeedText.style.color = "#22c55e";
            }
          }
          break;

        case 4:
          // Step 4: Level Clear Overlay (Victory Card)
          if (modalOverlay && modalBody) {
            modalOverlay.style.display = "flex";
            
            let title = "Level Cleared!";
            let desc = "You have completed the Solfège tutorial scale beautifully!";
            if (currentLang === "vi") {
              title = "Hoàn thành màn chơi!";
              desc = "Bạn đã chinh phục thang âm Đô-Rê-Mi xuất sắc!";
            } else if (currentLang === "ko") {
              title = "레벨 완료!";
              desc = "도레미 계음 강좌를 훌륭하게 이수하셨습니다!";
            }

            modalBody.innerHTML = `
              <div style="font-size: 4rem; margin-bottom: 0.5rem; animation: pulse 1s infinite;">🏆</div>
              <h3 style="font-family: 'Itim', sans-serif; font-size: 2.25rem; font-weight: 800; color: #15803d; margin: 0 0 0.5rem 0;">${title}</h3>
              <div style="font-size: 2rem; margin-bottom: 0.75rem;">⭐⭐⭐</div>
              <p style="font-family: 'Itim', sans-serif; font-size: 1.25rem; color: #4b5563; margin: 0; line-height: 1.4;">${desc}</p>
            `;
          }
          break;
      }
    }

    function updateDialogue() {
      // 1. Get character image
      const imageNum = (currentStep % 2 === 0) ? 8 : 9;
      melodyImgEl.src = `public/maincharacter/${imageNum}-lineboiler.gif`;

      // 2. Start word-by-word animation
      const langDialogues = DIALOGUES[currentLang] || DIALOGUES.en;
      typeWordByWord(langDialogues[currentStep], dialogueTextEl);

      // 3. Update guide card visual layout matching the dialogue
      updateGuideVisuals(currentStep);

      // 4. Play corresponding voice line
      playDialogueVoice(currentStep, currentLang);

      // 5. Update buttons
      // Back button
      if (currentLang === "vi") {
        btnBack.innerText = "← Quay lại";
      } else if (currentLang === "ko") {
        btnBack.innerText = "← 이전";
      } else {
        btnBack.innerText = "← Back";
      }

      // Next button label
      updateNextButtonLabel();
    }

    function updateNextButtonLabel() {
      if (currentStep === 4) {
        if (currentLang === "vi") {
          btnNext.innerText = "Bắt đầu →";
        } else if (currentLang === "ko") {
          btnNext.innerText = "시작 →";
        } else {
          btnNext.innerText = "Start →";
        }
      } else {
        if (currentLang === "vi") {
          btnNext.innerText = "Tiếp tục →";
        } else if (currentLang === "ko") {
          btnNext.innerText = "다음 →";
        } else {
          btnNext.innerText = "Next →";
        }
      }
    }

    function updateLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("signquest_lang", lang);
      langSelector.value = lang;
      updateDialogue();
    }

    // Initialize
    updateLanguage(currentLang);

    // Event Listeners
    langSelector.addEventListener("change", (e) => {
      updateLanguage(e.target.value);
    });

    btnBack.addEventListener("click", () => {
      // Stop typing if back is clicked to prevent overlap
      if (typingInterval) clearInterval(typingInterval);
      typingInterval = null;
      isTyping = false;

      if (currentStep > 0) {
        currentStep--;
        updateDialogue();
      } else {
        window.location.href = "index.html";
      }
    });

    btnNext.addEventListener("click", () => {
      if (isTyping) {
        // Skip typing, reveal text immediately
        if (typingInterval) clearInterval(typingInterval);
        typingInterval = null;
        isTyping = false;
        dialogueTextEl.innerText = fullActiveText;
      } else {
        // Proceed to next dialogue step
        if (currentStep < 4) {
          currentStep++;
          updateDialogue();
        } else {
          window.location.href = "level-select.html";
        }
      }
    });
  </script>
</body>
</html>
