<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melody in Motion - Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredoka:wght@300;400;500;600;700&family=Itim&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/intro.css">
</head>

<body>

  <!-- Floating Animated Music Notes Background -->
  <div class="floating-notes-container">
    <div class="floating-note note-1">𝄞</div>
    <div class="floating-note note-2">♪</div>
    <div class="floating-note note-3">♫</div>
    <div class="floating-note note-4">♩</div>
    <div class="floating-note note-5">♬</div>
    <div class="floating-note note-6">♩</div>
    <div class="floating-note note-7">♪</div>
    <div class="floating-note note-8">♫</div>
    <div class="floating-note note-9">𝄞</div>
    <div class="floating-note note-10">♬</div>
    <div class="floating-note note-11">♪</div>
    <div class="floating-note note-12">♩</div>
    <div class="floating-note note-13">♫</div>
    <div class="floating-note note-14">♬</div>
    <div class="floating-note note-15">𝄞</div>
    <div class="floating-note note-16">♪</div>
  </div>

  <div class="app-container"
    style="height: 100vh; max-height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
    <!-- Smol Header -->
    <header class="smol-header">
      <div class="logo-area" style="display: flex; align-items: center; gap: 0.5rem;">
        <img src="public/logo.PNG" alt="Melody in Motion Logo" class="header-logo-img">
        <h1
          style="font-size: 1.5rem; font-weight: 800; font-family: 'Cabin Sketch', cursive; color: #1e293b; margin: 0;">
          SignQuest</h1>
      </div>
      <div>
        <select id="lang-selector-header" class="synth-select"
          style="padding: 0.4rem 0.8rem; font-size: 1.1rem; border-radius: 8px; border: 3px solid #1e293b; background: #ffffff; color: #1e293b; font-family: 'Itim', sans-serif; cursor: pointer; outline: none;">
          <option value="en">🇺🇸 English</option>
          <option value="vi">🇻🇳 Tiếng Việt</option>
          <option value="ko">🇰🇷 한국어</option>
        </select>
      </div>
    </header>

    <!-- Main Card Container -->
    <main id="music-app-content"
      style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;">
      <div class="welcome-card-layout">
        <h2 class="welcome-title" style="margin: 0 0 0.5rem 0; font-family: 'Cabin Sketch', cursive;">Melody in Motion
        </h2>
        <p class="welcome-subtitle"
          style="text-align: center; font-size: 1.15rem; color: #475569; margin-top: -0.25rem; margin-bottom: 1.5rem; font-family: 'Itim', sans-serif;">
          Learn music through sign language with Melody!</p>

        <img src="public/play piano GIF by Internet Cat Video Festival.gif" alt="Melody in Motion Intro"
          class="welcome-gif">

        <!-- Buttons List -->
        <div class="welcome-buttons-list">
          <a href="intro.html" class="welcome-action-btn btn-start" id="btn-start-welcome">Start</a>
          <!-- <a href="sandbox.html" class="welcome-action-btn" id="btn-sandbox-welcome" style="background-color: #cbd5e1 !important; color: #1e293b !important;">🤟 ASL Sandbox</a> -->
        </div>
      </div>
    </main>
  </div>

  <script>
    const TRANSLATIONS = {
      en: {
        subtitle: "Learn music through sign language with Melody!",
        start: "Start",
        sandbox: "🤟 ASL Sandbox"
      },
      vi: {
        subtitle: "Học nhạc bằng Ngôn ngữ ký hiệu cùng Melody!",
        start: "Bắt đầu",
        sandbox: "🤟 Sandbox ASL"
      },
      ko: {
        subtitle: "멜로디와 함께 수어로 음악을 배워보세요!",
        start: "시작",
        sandbox: "🤟 ASL 샌드박스"
      }
    };

    const langSelector = document.getElementById("lang-selector-header");
    const subtitleEl = document.querySelector(".welcome-subtitle");
    const startBtnEl = document.getElementById("btn-start-welcome");
    const sandboxBtnEl = document.getElementById("btn-sandbox-welcome");

    function updateLanguage(lang) {
      localStorage.setItem("signquest_lang", lang);
      langSelector.value = lang;

      const dict = TRANSLATIONS[lang] || TRANSLATIONS.en;
      subtitleEl.innerText = dict.subtitle;
      startBtnEl.innerText = dict.start;
      sandboxBtnEl.innerText = dict.sandbox;
    }

    // Initialize language
    let savedLang = localStorage.getItem("signquest_lang");
    if (!savedLang) {
      savedLang = "en";
    }
    updateLanguage(savedLang);

    langSelector.addEventListener("change", (e) => {
      updateLanguage(e.target.value);
    });
  </script>
</body>

</html>
